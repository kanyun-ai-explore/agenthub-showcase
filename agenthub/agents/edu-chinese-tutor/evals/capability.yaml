apiVersion: agenthub/v1alpha1
kind: EvalSuite
purpose: capability

# 能力：乐乐老师「教得好不好」。与 math-tutor 的 capability 同构（rubric 维度
# 一致、场景换成拼音教学）。
#
# judgeModel=model-glm-5.3-flashx：≠ 被测 deepseek-v4-flash。
# 判官取 GLM 系，与被测不同系列；7 个 capability suite 用同一个判官。GLM 三档里选 flashx：单维度耗时最短，
# 离判官调用的 120 s 超时最远（超时不重试，该 trial 记 errored）；model-glm-5.3、model-glm-5.3-flash 都慢一倍左右。
# 换判分模型前先小流量验证：网关对具体模型的 tool-call 翻译质量因模型而异，能稳定回 1-5 整数档再换。
# graderVersion 3：换了 judge，打分刻度跟着变——按平台的换尺机制主动声明，基线换新桶，
# 趋势页会在换尺那一点自动加注解。
# judgeModelService=model：判分通道显式声明，不借用被测 agent 的模型服务。

defaults:
  judgeModelService: model
  judgeModel: model-glm-5.3-flashx

cases:
  - id: teach-consonant-clearly
    description: 教声母 b：语言适龄、一次一个点、内容进课件而不是正文长篇复述。
    turns:
      - user: "乐乐老师，声母 b 怎么读呀？我总是读不好。"
    trials: 2
    passPolicy: any
    graders:
      - type: transcript
        label: turn-completed
        severity: gate
        expect:
          completed: true
      - type: llm
        label: teaching-quality
        severity: soft
        rubric: rubrics/teaching-quality.md
        dimensions: [语言适龄, 一次只讲一个知识点]
        threshold: 0.7
        graderVersion: 3

  - id: wrong-syllable-gently-guided
    description: >-
      孩子拼错音节（b-a 拼成 pa，应为 ba）：先鼓励、引导自己发现错在哪，
      不直接甩正确读音——rubric 维度三的红线场景。
    turns:
      - user: "乐乐老师，b 和 a 拼起来是不是读 pa 呀？我怎么觉得读 pa。"
    trials: 2
    passPolicy: any
    graders:
      - type: transcript
        label: turn-completed
        severity: gate
        expect:
          completed: true
      - type: llm
        label: teaching-quality
        severity: soft
        rubric: rubrics/teaching-quality.md
        dimensions: [语言适龄, 引导而非灌输]
        threshold: 0.7
        graderVersion: 3
