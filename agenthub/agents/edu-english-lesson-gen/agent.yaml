apiVersion: agenthub/v1alpha1
format: claude_code

# 英语小课单元 3 的后台出题。学员每做完单元 1 或 2 的一关，站点在后台发一条【出题】，它调一次
# present_lesson 把单元 3 的一关 8 道题出齐。讲解、跟读点评、单元点评仍归 edu-english-coach（站点的主会话）。
#
# 为什么单独一个 agent：coach 声明了 voice.input（跟读要转写），声明 voice 的 agent 只能走模型网关，而模型网关上的
# deepseek-v4-flash 关不掉推理。一个【出题】回合从派发到首个工具入参 p50 27.3 s，其中推理约
# 16 s。出题用不到语音，拆出来就能关推理。
#
# 模型走项目级模型服务 `deepseek`（DeepSeek 官方 Anthropic 兼容口，thinkingDialect=absent_on），effort none = 关推理，
# 和 edu-math-tutor 同一条路。model id 和 edu-math-tutor 一样写 deepseek-flash：这个服务只认
# deepseek-flash / deepseek-v4-flash / deepseek-reasoner，别的名字回 400。
# 模型网关上两个不推理的模型过不了出题规则：页面画不出、只能跳过的题，qwen3-vl-plus 在 13/18 关里出现，
# gemini-3.1-flash-lite 在 10/18 关里出现。
#
# 这条直连路的风险：运行时版本要够新，所以 environment 必须是下面的 cma-python-podagent。站点有退路：本 agent 的会话建不起来、出题回合失败或超时，
# 这一关退到第二个 coach 会话再出（apps/storefront-web/lib/course/turn-queue.ts 的 demoteBackground）。
modelService: deepseek
model: deepseek-flash

# 不声明 voice：出题回合只调工具，不转写、不合成。

# system prompt 在同目录的 CLAUDE.md：从 edu-english-coach 的 CLAUDE.md 抽出出题要用的部分（教学范围、【出题】、
# 怎么出好一关的 8 道题），出题规则逐字不改（coach 改了出题规则，这边要跟着改）。

mcpServers:
  # 和 coach 同一个教育 MCP（present_lesson 由站点的 /api/mcp/course 提供，见 coach 的 agent.yaml）。本 agent 只调 present_lesson。
  # ⚠️ 换成你自己控制面上注册的 managed MCP id。
  - vcrd_PLACEHOLDER

environment: cma-python-podagent  # 这个环境的运行时版本够新；评测会话也按这个名字解析运行时

agentOptions:
  # 正常一轮就完：调一次 present_lesson，可能再回一句 OK。工具报错时按报错改好再调一次，留两轮余量。
  maxTurns: 4
  # none = 关推理（`deepseek` 服务标了 absent_on，平台按它注入 thinking: disabled）。
  effort: none
  allowedTools: [mcp__course]
  # 内置工具全部关掉（写了 CLI 没有的工具名不会出错，只是匹配不上）。本 agent 没有 skills、
  # 没有运行时代码，CLAUDE.md 由平台注入，什么内置工具都不用。
  disallowedTools: [Read, Write, Edit, MultiEdit, NotebookEdit, Bash, Grep, Glob, LS, WebFetch, WebSearch, Skill, Task, Monitor, REPL, Workflow]

# 不带 env：coach 的 PYTHONPATH / CMA_UI_DELIVERY 是给 stdio 版 course server 的，教育 MCP 换成 remote 以后本 agent 用不到，
# 目录里也没有 runtime/。

# 不带记忆：出题只看消息里的错题。coach 的 memory_recall 读出来的条目一直是空的。
memory:
  enabled: false
