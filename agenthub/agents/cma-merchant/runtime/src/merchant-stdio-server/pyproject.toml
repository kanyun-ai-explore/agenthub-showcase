[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "merchant-stdio-server"
version = "0.1.0.dev0"
description = "stdio MCP server exposing CMA's MerchantToolExecutor (unmodified) to the AgentHub sandbox's Claude Code CLI. New code for this repo; not part of upstream commerce-agents — see repo root NOTICE."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "agenthub-showcase" }]
# Pinned to the sibling dev versions this repo vendors together (scripts/vendor-cma.sh);
# a lone install of this package fails instead of resolving public distributions of the
# same name (neither is registered on PyPI — same convention upstream uses for its own
# sibling packages, see upstream requirements.txt's header comment).
dependencies = [
  "commerce-common==0.1.0.dev0",
  "shopping-agent-core==0.1.0.dev0",
  "merchant-agent-core==0.1.0.dev0",
  "mcp>=1.2",
  # The approval-sync call to storefront-web's contract-b endpoints, and mirroring
  # staged changes there for the operator page — see __main__.py's module docstring.
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["merchant_stdio_server"]
