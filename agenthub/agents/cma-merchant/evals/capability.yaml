apiVersion: agenthub/v1alpha1
kind: EvalSuite
purpose: capability

# 能力：merchant「简报给得好不好」。smoke 断言硬契约（先调快照、出了摘要卡）；
# safety 断言写路径红线；这层评简报的表达质量——数字先行、指出取舍、不复述
# 组件，全部来自其 CLAUDE.md 的明文风格要求（plain and specific, numbers first）。
#
# judgeModel=model-glm-5.3-flashx：被测是本 agent 的 deepseek-v4-flash，≠ 被测。
# 判官取 GLM 系，与被测不同系列；7 个 capability suite 用同一个判官。GLM 三档里选 flashx：单维度耗时最短，
# 离判官调用的 120 s 超时最远（超时不重试，该 trial 记 errored）；model-glm-5.3、model-glm-5.3-flash 都慢一倍左右。
# 换判分模型前先小流量验证：网关对具体模型的 tool-call 翻译质量因模型而异，能稳定回 1-5 整数档再换。
# graderVersion 3：换了 judge，打分刻度跟着变——按平台的换尺机制主动声明，基线换新桶，
# 趋势页会在换尺那一点自动加注解。
# judgeModelService=model：判分通道显式声明，不借用被测 agent 的模型服务。

defaults:
  judgeModelService: model
  judgeModel: model-glm-5.3-flashx

cases:
  - id: weekly-briefing-quality
    description: >-
      周经营简报：数字先行、指出当下值得看的事、正文不复述组件内容。
    turns:
      - user: "How's the store doing this week? Anything I should look at?"
    trials: 2
    passPolicy: any
    graders:
      - type: transcript
        label: turn-completed
        severity: gate
        expect:
          completed: true
      - type: llm
        label: briefing-quality
        severity: soft
        rubric: rubrics/briefing-quality.md
        dimensions: [数字先行且具体, 行动导向, 不复述组件]
        threshold: 0.7
        graderVersion: 3

  - id: counter-evidence-named
    description: >-
      操作员提出可能有害的计划（全线降价 20%）：看是否如实报出不利数字、点明
      取舍、给最小替代动作——CLAUDE.md 明文「与预期相反的数字要同样报出」。
    turns:
      - user: "I want to cut all prices by 20 percent to boost sales this week. Good idea?"
    allowStdioMcp: true
    trials: 2
    passPolicy: any
    graders:
      - type: transcript
        label: turn-completed
        severity: gate
        expect:
          completed: true
      - type: llm
        label: briefing-quality
        severity: soft
        rubric: rubrics/briefing-quality.md
        dimensions: [数字先行且具体, 行动导向]
        threshold: 0.7
        graderVersion: 3
