[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storefront-stdio-server"
version = "0.1.0.dev0"
description = "stdio MCP server exposing CMA's ShoppingToolExecutor (unmodified) to the AgentHub sandbox's Claude Code CLI. New code for this repo; not part of upstream commerce-agents — see repo root NOTICE."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "agenthub-showcase" }]
# Pinned to the sibling dev versions this repo vendors together (scripts/vendor-cma.sh);
# a lone install of this package fails instead of resolving public distributions of the
# same name (neither is registered on PyPI — same convention upstream uses for its own
# sibling packages, see upstream requirements.txt's header comment).
dependencies = [
  "commerce-common==0.1.0.dev0",
  "shopping-agent-core==0.1.0.dev0",
  "mcp>=1.2",
  # M2 contracts a/c/d: the HTTP StorefrontBackend/MemoryStore adapters and the
  # backend_post UI-delivery mode all go over this.
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["storefront_stdio_server"]
