apiVersion: agenthub/v1alpha1
format: claude_code

# 英语小课的老师 agent，界面是闯关式的课程页（路径图 + 关卡播放器），学员是 B1 起点的青少年和成人。
# 定位是 agent 能力的 showcase，不是完整应用：进度只存浏览器 localStorage，不建后端。
# 课程 v2：单元 1、2 的题写死在页面里，它不出；它只在四个
# 时刻出场——学员每做完单元 1 或 2 的一关，后台照错题出单元 3 的一关；一个单元做完写一句单元点评；
# 学员点「为什么」时讲一题；跟读时给一句文字点评。判题、推进、音效都在页面本地，学员作答期间不等它。
#
# 模型走项目级「模型服务」`model`，与其余教育 agent 相同：密钥留在服务端，沙箱里只看得到
# 本地代理。这里的 `model` 会盖掉服务里配的模型，所以要写模型服务认得的 id。
#
# effort: low。**不关思考**——关思考要靠模型服务在请求没带 thinking 字段时注入 disabled，
# 那是 edu-math-tutor 单独走 `deepseek` 服务的原因，本 agent 不需要。
#
# 「跟读」走平台语音回合，所以这里声明 voice.input（转写）：语音回合在**派发前**同步
# 转写，转写文本就是这一轮的 user.text，agent 拿到的和打字进来的一模一样。
#
# - `input.model` = `qwen3-asr-flash`，`language: en`：language 是可选字符串，平台原样作为
#   multipart 的 language 字段转给模型网关；实测 qwen3-asr-flash 带 language=en 回 200、文本正确。
# - **不声明 `output`**：跟读只要文字点评。声明了它，平台会在每个回合终态后把回复合成成分段
#   音频——出题回合也合，页面一段都不播。页面也不读回合音频：跟读的文字点评走
#   /api/agenthub/turn-result。
# - 之前用的是 azure-openai-gpt-4o-mini-transcribe（输出 azure-openai-gpt-4o-mini-tts / alloy / mp3）。
# 声明了 voice 的 agent 必须走模型网关上的模型服务（平台在创建会话时校验），本 agent 用的就是 `model`。
# 听音题的读音来自平台的朗读 agent edu-english-reader，与这里互不影响。
modelService: model
model: deepseek-v4-flash

voice:
  input:
    provider: modelgate
    model: qwen3-asr-flash
    language: en

# system prompt 在同目录的 CLAUDE.md（claude_code 格式的约定文件）。

# 教育 agent 共用一个 MCP：课件、课程目录、学情数据、以及所有 present_* 展示工具。
# 共用而不是每个 agent 一个，是因为它们看的是同一份业务数据，拆开只会让口径漂移。
# ⚠️ 换成你自己控制面上注册的 managed MCP id。填错不会被
# `agenthub agent check` 拦下，只有流水线 freeze 时才报。
mcpServers:
  # 教育 MCP，用 remote 而不是 stdio：`always_ask` 这类工具级人工审批只在经网关的
  # remote MCP 上有强制点，给 stdio 声明会在发布期被直接拒掉。服务端实现由
  # apps/storefront-web 的 /api/mcp/course 提供（Streamable HTTP），逻辑与
  # shared/course-stdio-server 由 scripts/course-mcp-parity/run.sh 对拍锁住。
  # serverKey 仍是 course（由 displayName slug 化），所以 mcp__course__* 与 allowedTools 不变。
  # 注册时对 get_student_progress 声明了 always_ask：调用会暂停等人工审批。
  # ⚠️ 本 agent 用到的 present_lesson（整关出题）和四个单题工具随本仓代码一起发布——
  # 站点先发，agent 才调得到。
  - vcrd_PLACEHOLDER

environment: cma-python         # 与电商两个 agent 同一个 Environment

agentOptions:
  maxTurns: 16
  effort: low
  allowedTools: [Skill, mcp__course]
  # 内置工具面：对齐上游 CMA 的 `tools=["Skill"]`（挂载面只留 Skill）。
  # 平台没有「挂载面」字段，所以用 disallowedTools 取补集等价实现；allowedTools 只是
  # 配置期的意图声明，两个都写。
  # 本 agent 不依赖任何内置工具：无 skills、无 setupScriptFile，记忆文档由平台侧检索，
  # CLAUDE.md 由平台注入，都不经过 Read。
  disallowedTools: [Read, Write, Edit, Bash, Grep, Glob, LS, WebFetch]

env:
  PYTHONPATH: "/workspace/.session/agent-package/runtime/src/course-stdio-server"
  # D-R4 mode A：present_* 的返回文本本身就是 UI 信封，不需要沙箱反向打回浏览器。
  CMA_UI_DELIVERY: result_text

# 运营口径写成随发布冻结的记忆文档，不写进提示词。
memory:
  enabled: true
