apiVersion: agenthub/v1alpha1
kind: EvalSuite
purpose: capability

# 能力：Emma 老师两个纯文字协议的回复质量——【为什么】讲得清不清、【结算】点
# 评得具不具体。smoke 只断言「调没调工具、有没有中文」，语义质量交给 llm grader。
#
# judge 用 model-glm-5.3-flashx：≠ 被测 deepseek-v4-flash。
# 判官取 GLM 系，与被测不同系列；7 个 capability suite 用同一个判官。GLM 三档里选 flashx：单维度耗时最短，
# 离判官调用的 120 s 超时最远（超时不重试，该 trial 记 errored）；model-glm-5.3、model-glm-5.3-flash 都慢一倍左右。
# 换判分模型前先小流量验证：网关对具体模型的 tool-call 翻译质量因模型而异，能稳定回 1-5 整数档再换。
# graderVersion 3：换了 judge，打分刻度跟着变——按平台的换尺机制主动声明，基线换新桶，
# 趋势页会在换尺那一点自动加注解。
# judgeModelService=model：判分通道显式声明，不借用被测 agent 的模型服务。

defaults:
  judgeModelService: model
  judgeModel: model-glm-5.3-flashx

cases:
  - id: why-explanation-quality
    description: >-
      【为什么】协议：讲一道一年级填空错题——先说对的为什么对，再点出孩子
      选的差在哪，一两句中文。
    turns:
      - user: >-
          【为什么】题目（fill_blank）：This ___ milk.（正确答案 is），孩子选了 am。
    trials: 2
    passPolicy: any
    graders:
      - type: transcript
        label: turn-completed
        severity: gate
        expect:
          completed: true
      - type: llm
        label: protocol-reply-quality
        severity: soft
        rubric: rubrics/protocol-reply-quality.md
        dimensions: [讲解针对性, 语言简明]
        threshold: 0.7
        graderVersion: 3

  - id: settlement-comment-quality
    description: >-
      【结算】协议：一句中文点评——先具体说哪里做得好，再指出最该再练的一个点，
      四十字以内。
    turns:
      - user: >-
          【结算】孩子做完了第 1 单元第 1 关「打招呼」：8 道首次答对 6 道。错过的
          题：listen_choice，正确答案 I like milk，孩子选了 I like cake。下一关是
          「我喜欢的东西」，lesson_id=u1-l2。
    trials: 2
    passPolicy: any
    graders:
      - type: transcript
        label: turn-completed
        severity: gate
        expect:
          completed: true
      - type: llm
        label: protocol-reply-quality
        severity: soft
        rubric: rubrics/protocol-reply-quality.md
        dimensions: [讲解针对性, 语言简明]
        threshold: 0.7
        graderVersion: 3
