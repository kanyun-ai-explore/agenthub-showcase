apiVersion: agenthub/v1alpha1
format: live

# 英语小课三期：咖啡店情景对话（roleplay）。学员和这个 agent 用对讲机式语音聊 3–4 轮，
# 页面上最后出一张前端生成的小结卡。
#
# **为什么是 live**：三期要展示的就是 `format: live` 这条运行时——不建沙箱、不烘镜像、
# 不带托管 MCP，会话只由「定义文档 + 模型服务 + 记忆召回」三样拼起来。代价是它也
# **调不了任何工具**（没有沙箱进程可跑），所以小结卡由页面前端从转写和回复里自己生成，
# 不靠 present_* 工具。平台对 live 定义的形状要求：
# 只允许 apiVersion / format / modelService / model / memory / channels / live:{} / voice，
# `environment`、`mcpServers`、`agentOptions`、`env` 这些 claude_code 专属键出现即拒。
#
# modelService 是 **live 臂的必填项**（claude_code 臂里它是可选的）：live 会话没有
# 登录的调用方，按调用方路由模型凭据那条路不适用，会话必须在创建时冻结一个
# 项目级模型服务。这里用的是 `model`，密钥留在服务端。
# ⚠️ 这个名字按**项目内**解析：换项目发布时，换成那个项目里注册的模型服务名。
#
# memory 关掉：情景对话的上下文全在这一条会话里，记忆召回只会给首字加一次额外的
# 往返，而「首字快」正是选 live 的理由。回合历史照常保留（那是会话自己的事）。
#
# model 不跟服务默认的 deepseek-v4-flash：它经模型网关每回合都先推理（显式
# `thinking: disabled` 也被忽略），live 上首正文前多出 p50 约 3 s。gemini-3.1-flash-lite
# 在同样的请求形状下 0/5 推理、首正文 p50 约 0.9 s（直连探针实测）。
# qwen3-vl-flash 更快，但守不住 CLAUDE.md 里「孩子说不舒服要建议告诉家长或老师」那条（0/4），
# 所以没选它。这里的 model 不需要在服务的档位里登记，服务的密钥有权调用它就行。
modelService: model
model: gemini-3.1-flash-lite

# 语音：input 是「派发前同步转写」——学员按住说话录的一段音，平台先转成文字再作为这一轮
# 的 user.text 交给 agent（它收到的和打字进来的一模一样）；output 是「回合终态后合成」——
# agent 回的那句话被合成分段音频，页面播给学员听。声明了 voice 的 agent 必须走模型网关上的
# 模型服务，这里用的就是上面的 `model`。
#
# 转写和合成都用 qwen（之前是 azure；店员开口是这个视角的核心，output 保留）。
# - `format` 在平台契约里只能填 `mp3`，但 qwen3-tts-flash 不认 mp3，不管请求什么格式都回
#   WAV（PCM 24 kHz 单声道；RIFF/data 长度是流式占位值），平台存段时仍标 `audio/mpeg`。
#   页面直接把段的签名 URL 交给 `<audio>`，靠浏览器按内容识别：同形 WAV 标 audio/mpeg 在
#   chromium 148 / webkit 26.4 都能播完、`ended` 照常触发（本地实测）。
# - input 的 `language: en` qwen3-asr-flash 收（直调模型网关实测）。
voice:
  input:
    provider: modelgate
    model: qwen3-asr-flash
    language: en
  output:
    provider: modelgate
    model: qwen3-tts-flash
    voice: Cherry
    format: mp3

memory:
  enabled: false

# system prompt 在同目录的 CLAUDE.md（定义文档是 live 唯一的指令来源）。
