apiVersion: agenthub/v1alpha1
kind: EvalSuite
purpose: capability

# 能力：批改小助手「反馈给得好不好」。smoke 回答「活没活、卡片发没发」，这层由
# llm grader 按 rubrics/homework-feedback-quality.md 评反馈质量——错因点得清不清、
# 引导分不分层、语气鼓不鼓励。
#
# capability 语义：不阻断发布门禁，分数进趋势页看走势。trials: 2 + passPolicy: any
# ——judge 有方差，能力层信号优先于严格。
#
# judge 用 model-glm-5.3-flashx：被测模型是本 agent 的 deepseek-v4-flash，judge 必须
# 不同（resolve 层防自评硬校验）。
# 判官取 GLM 系，与被测不同系列；7 个 capability suite 用同一个判官。GLM 三档里选 flashx：单维度耗时最短，
# 离判官调用的 120 s 超时最远（超时不重试，该 trial 记 errored）；model-glm-5.3、model-glm-5.3-flash 都慢一倍左右。
# 换判分模型前先小流量验证：网关对具体模型的 tool-call 翻译质量因模型而异，能稳定回 1-5 整数档再换。
# graderVersion 3：换了 judge，打分刻度跟着变——按平台的换尺机制主动声明，基线换新桶，
# 趋势页会在换尺那一点自动加注解。
# judgeModelService=model：判分通道显式声明，不借用被测 agent 的模型服务。

defaults:
  judgeModelService: model
  judgeModel: model-glm-5.3-flashx

cases:
  - id: wrong-answer-well-corrected
    description: >-
      孩子交了答错的题求确认（13-5=9，应为 8）：看是否点名错在哪一步、先引导
      而非直接报答案、语气鼓励。
    turns:
      - user: "我算了一下 13-5=9，对吗？帮我看看。"
    trials: 2
    passPolicy: any
    graders:
      - type: transcript
        label: turn-completed
        severity: gate
        expect:
          completed: true
      - type: llm
        label: feedback-quality
        severity: soft
        rubric: rubrics/homework-feedback-quality.md
        dimensions: [反馈具体性, 分层引导, 语气鼓励]
        threshold: 0.7
        graderVersion: 3

  - id: answer-begging-gently-refused
    description: >-
      孩子不会做、直接要答案：看是否温和引导而不直接给（分层引导的红线场景）。
    turns:
      - user: "8+5 我不会算，你直接告诉我答案吧，求你了。"
    trials: 2
    passPolicy: any
    graders:
      - type: transcript
        label: turn-completed
        severity: gate
        expect:
          completed: true
      - type: llm
        label: feedback-quality
        severity: soft
        rubric: rubrics/homework-feedback-quality.md
        dimensions: [分层引导, 语气鼓励]
        threshold: 0.7
        graderVersion: 3
